# Builds the mod against the latest HomefrontSDK package from GitHub Packages. A v* tag (v0.2.0) builds with that
# version and makes a GitHub Release with the mod's .dll and .pdb, its notes naming the HomefrontSDK release it needs.
name: Build

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  packages: read

env:
  MOD: MyPlugin  # Rename.ps1 changes this with the project

jobs:
  build:
    runs-on: windows-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # read by nuget.config for the GitHub Packages feed
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Version from tag
      if: github.ref_type == 'tag'
      run: "\"VERSION_ARG=-p:Version=$($env:GITHUB_REF_NAME.TrimStart('v'))\" >> $env:GITHUB_ENV"
    - name: Build
      run: dotnet build "$env:MOD.slnx" -c Release -nologo $env:VERSION_ARG
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.MOD }}
        path: |
          bin/Release/net10.0/${{ env.MOD }}.dll
          bin/Release/net10.0/${{ env.MOD }}.pdb
    - name: GitHub Release
      if: github.ref_type == 'tag'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        $sdk = (dotnet list "$env:MOD.csproj" package --format json | ConvertFrom-Json).projects[0].frameworks[0].topLevelPackages |
          Where-Object id -eq HomefrontSDK | ForEach-Object resolvedVersion
        $notes = "Needs [HomefrontSDK v$sdk](https://github.com/TylerJaacks/HomefrontSDK/releases/tag/v$sdk) and " +
                 "[HomefrontModLoader](https://github.com/TylerJaacks/HomefrontModLoader/releases). " +
                 "Install as ``Homefront Dedicated Server\Binaries\HomefrontSDK\Mods\$env:MOD\$env:MOD.dll``."
        gh release create $env:GITHUB_REF_NAME "bin/Release/net10.0/$env:MOD.dll" "bin/Release/net10.0/$env:MOD.pdb" `
          --title "$env:MOD $env:GITHUB_REF_NAME" --notes $notes --generate-notes
